<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mars Pathfinder — NASA Space Apps 2026 Stop-Motion</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #07090e;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #07090e;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="s1_problem"
        data-composition-id="s1_problem"
        data-composition-src="compositions/s1_problem.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s2_solution"
        data-composition-id="s2_solution"
        data-composition-src="compositions/s2_solution.html"
        data-start="5"
        data-duration="10"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s3_demo"
        data-composition-id="s3_demo"
        data-composition-src="compositions/s3_demo.html"
        data-start="15"
        data-duration="10"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s4_impact"
        data-composition-id="s4_impact"
        data-composition-src="compositions/s4_impact.html"
        data-start="25"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio id="bg-music" data-start="0" data-duration="30" data-track-index="2" data-volume="0.13" data-fade-in="0.3" data-fade-out="1.2" src="assets/music/bg.mp3"></audio>
      <audio id="vo" data-start="0.2" data-duration="29.5" data-track-index="4" data-volume="1.0" src="assets/voiceover.mp3"></audio>
      <audio id="sfx-p1" data-start="0.3" data-duration="0.4" data-track-index="3" data-volume="0.45" src="assets/sfx/snap1.ogg"></audio>
      <audio id="sfx-p2" data-start="2.4" data-duration="0.4" data-track-index="3" data-volume="0.45" src="assets/sfx/snap2.ogg"></audio>
      <audio id="sfx-s1" data-start="5.1" data-duration="0.4" data-track-index="3" data-volume="0.50" src="assets/sfx/slide1.ogg"></audio>
      <audio id="sfx-s2" data-start="7.2" data-duration="0.4" data-track-index="3" data-volume="0.40" src="assets/sfx/snap1.ogg"></audio>
      <audio id="sfx-s3" data-start="9.6" data-duration="0.4" data-track-index="3" data-volume="0.40" src="assets/sfx/snap2.ogg"></audio>
      <audio id="sfx-d1" data-start="15.1" data-duration="0.4" data-track-index="3" data-volume="0.50" src="assets/sfx/slide1.ogg"></audio>
      <audio id="sfx-d2" data-start="17.0" data-duration="0.3" data-track-index="3" data-volume="0.40" src="assets/sfx/switch1.ogg"></audio>
      <audio id="sfx-d3" data-start="19.0" data-duration="0.3" data-track-index="3" data-volume="0.40" src="assets/sfx/snap1.ogg"></audio>
      <audio id="sfx-d4" data-start="21.0" data-duration="0.3" data-track-index="3" data-volume="0.40" src="assets/sfx/snap2.ogg"></audio>
      <audio id="sfx-d5" data-start="23.0" data-duration="0.3" data-track-index="3" data-volume="0.45" src="assets/sfx/switch2.ogg"></audio>
      <audio id="sfx-i1" data-start="25.1" data-duration="0.3" data-track-index="3" data-volume="0.50" src="assets/sfx/switch2.ogg"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
